<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 2</title>
    <script src="https://d3js.org/d3.v7.min.js"></script> <!-- Load D3 library -->
    <link rel="stylesheet" href="style.css"> <!-- Connect to style.css for styles -->
</head>

<body class="vertical-container">
    <!-- HEADER -->
    <div class="item">
        <h1>Aircraft Incidents</h1>
        <p><strong>Author:</strong> Bella Lee</p>
        <p><strong>Documentation:</strong> <a
                href="https://docs.google.com/document/d/1-477ghQ57b7GA2KF8gbz4sszZvGAFrGLJLB052TA3vA/edit?usp=sharing"
                target="_blank">View in Google Docs</a></p>
    </div>

    <!-- INTERACTIVE WIDGETS -->
    <div class="item horizontal-container">
        <div class="item"><!-- Your widget 1 code goes here. -->
            <!-- Injury Type Dropdown -->
            <div class="widget">
                <label for="injurySelect">Select injury type:</label>

                <div class="select-container">
                    <select id="injurySelect">
                        <option value="Fatal">Fatal</option>
                        <option value="Incident">Incident</option>
                        <option value="Non-Fatal">Non-Fatal</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="item">
            <div class="widget">
                <label for="trendline-toggle">Show Trendline</label>
                <input type="checkbox" id="trendline-toggle">
            </div>
        </div>
    </div>

    <!-- CHART(S) -->
    <div class="item chart-container">
        <h2>Total Aircraft Incidents Per Year</h2>
        <svg id="lineChart1" width="900" height="400"></svg>
    </div>
    <script src="main.js"></script>
</body>

</html>
